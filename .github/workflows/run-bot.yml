name: Run WorserFish19

on:
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Download lichess-bot & Stockfish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh repo clone lichess-bot-devs/lichess-bot bot -- --depth 1
          mkdir -p bot/engines/stockfish
          gh release download --repo official-stockfish/Stockfish --pattern "*ubuntu-x86-64-avx2.tar*" -O sf.tar
          tar -xf sf.tar -C bot/engines/stockfish --strip-components=1
          find bot/engines/stockfish -type f -name "stockfish*" -exec mv {} bot/engines/stockfish/stockfish-linux-x86-64-universal \;
          chmod +x bot/engines/stockfish/stockfish-linux-x86-64-universal

      - name: Checkout your repo
        uses: actions/checkout@v4
        with:
          path: my-repo

      - name: Install dependencies & configure
        env:
          LICHESS_TOKEN: ${{ secrets.LICHESS_TOKEN }}
        run: |
          cp my-repo/homemade.py bot/homemade.py
          cd bot
          pip install -r requirements.txt
          cp config.yml.default config.yml
          sed -i "s/xxxxxx/$LICHESS_TOKEN/g" config.yml
          sed -i 's/protocol: "uci"/protocol: "homemade"/g' config.yml
          sed -i 's/name: "engine_name"/name: "WorserFish19"/g' config.yml

      - name: Start WorserFish19
        run: |
          cd bot
          python lichess-bot.py
