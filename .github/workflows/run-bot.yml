name: Run WorserFish19

on:
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Checkout your repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Upgrade account to BOT
        env:
          LICHESS_TOKEN: ${{ secrets.LICHESS_TOKEN }}
        run: |
          curl -s -d '' https://lichess.org -H "Authorization: Bearer $LICHESS_TOKEN"

      - name: Download lichess-bot & Stockfish
        run: |
          wget -q https://github.com -O bot.zip
          unzip -q bot.zip
          mv lichess-bot-master bot
          cp homemade.py bot/homemade.py
          mkdir -p bot/engines/stockfish
          SF_URL=$(curl -s https://github.com | grep "browser_download_url.*ubuntu-x86-64-avx2.tar" | cut -d '"' -f 4 | head -n 1)
          wget -q "$SF_URL" -O sf.tar
          tar -xf sf.tar -C bot/engines/stockfish --strip-components=1
          mv bot/engines/stockfish/stockfish* bot/engines/stockfish/stockfish-linux-x86-64-universal
          chmod +x bot/engines/stockfish/stockfish-linux-x86-64-universal

      - name: Install dependencies & configure
        env:
          LICHESS_TOKEN: ${{ secrets.LICHESS_TOKEN }}
        run: |
          cd bot
          pip install -r requirements.txt
          cp config.yml.default config.yml
          sed -i "s/xxxxxx/$LICHESS_TOKEN/g" config.yml
          sed -i 's/protocol: "uci"/protocol: "homemade"/g' config.yml
          sed -i 's/name: "engine_name"/name: "WorserFish19"/g' config.yml

      - name: Start WorserFish19
        run: |
          cd bot
          python lichess-bot.py
